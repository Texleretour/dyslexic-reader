include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Traiter ces warnings comme des erreurs
    missing_required_param: error
    missing_return: error
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning
  exclude:
    - "**/*.g.dart"       # fichiers générés
    - "**/*.freezed.dart"

linter:
  rules:
    # --- Style & lisibilité ---
    always_declare_return_types: true       # toujours typer les retours de fonction
    always_put_required_named_parameters_first: true
    annotate_overrides: true                # toujours mettre @override
    avoid_print: true                       # utiliser un logger, pas print()
    prefer_single_quotes: true             # cohérence des strings
    require_trailing_commas: true          # meilleure lisibilité des diffs Git
    sort_child_properties_last: true       # child/children en dernier dans les widgets

    # --- Sécurité & robustesse ---
    avoid_dynamic_calls: true              # éviter les appels sur dynamic
    avoid_returning_null_for_future: true
    cancel_subscriptions: true             # toujours cancel() les StreamSubscriptions
    close_sinks: true                      # toujours fermer les StreamSinks
    unawaited_futures: true                # forcer l'await sur les Futures

    # --- Architecture ---
    avoid_classes_with_only_static_members: true  # utiliser des fonctions top-level
    prefer_final_fields: true              # immutabilité par défaut
    prefer_final_locals: true

    # --- Désactivés volontairement ---
    public_member_api_docs: false          # trop verbeux pour un projet étudiant
    always_specify_types: false            # l'inférence de type est suffisante